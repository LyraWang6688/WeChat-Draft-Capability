name: Publish Ready Articles to WeChat Drafts

on:
  # 刻意不使用 push-level `paths:` filter。
  # GitHub 的 paths filter 基于 before/after endpoint 变更文件判定，因此
  # ready(A) → draft(B) → ready(C) 且 C 与 A 内容逐字节相同的 push，
  # endpoint diff 为空 —— workflow 根本不会启动，range detector 再正确也没机会跑。
  # 这里让所有 main push 都启动，由 deterministic internal detector 判定
  # 存在 0 还是 N 个 authorization；普通 docs/code push 会在 count=0 时快速正常结束，
  # 不会产生任何 Publisher 调用。
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run: log requests but do not call the Publisher API"
        type: boolean
        required: false
        default: false

concurrency:
  group: publish-ready-articles-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Detect ready_to_upload and call Publisher
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLISHER_ENDPOINT: ${{ secrets.PUBLISHER_ENDPOINT }}
      PUBLISHER_WEBHOOK_TOKEN: ${{ secrets.PUBLISHER_WEBHOOK_TOKEN }}
    steps:
      - name: Enforce main branch for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "::error::workflow_dispatch 只允许在 main 分支运行（当前 ${{ github.ref }}）。未 Merge 的 feature branch 内容不允许直接送入微信公众号草稿箱。"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Detection is the single production implementation in scripts/lib; the
      # workflow only orchestrates. Candidates come from EVERY commit in the push
      # range (not the BASE<->HEAD endpoint diff), so a ready -> draft -> ready
      # reauthorization is found even when the endpoint content is unchanged.
      - name: Detect article authorizations (transitions into ready_to_upload)
        id: detect
        run: |
          set -euo pipefail

          ZERO_SHA="0000000000000000000000000000000000000000"
          HEAD_SHA="${{ github.sha }}"
          BASE_SHA="${{ github.event.before }}"

          # For manual dispatch, diff the selected branch head against its parent.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || echo "$ZERO_SHA")"
          fi
          if [[ -z "$BASE_SHA" ]]; then
            BASE_SHA="$ZERO_SHA"
          fi

          TRANSITIONS_FILE="$RUNNER_TEMP/transitions.json"

          # stdout is pure JSON; --out persists it for later steps. Human/notice
          # output goes to stderr. The detector always exits 0 (empty list = none).
          node scripts/detect-ready-transitions.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --out "$TRANSITIONS_FILE"

          COUNT="$(jq '.transitions | length' "$TRANSITIONS_FILE")"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "::notice::Detected ${COUNT} article authorization(s) in this range."

      # P1-1: the EXACT immutable commit that will be sent to the Publisher must
      # first pass the same Content Contract Validator. Validated SHA == published
      # SHA. Any failure aborts the job BEFORE any Publisher/WeChat side effect.
      - name: Validate each authorized article package at its exact commit
        if: steps.detect.outputs.count != '0'
        run: |
          set -euo pipefail

          TRANSITIONS_FILE="$RUNNER_TEMP/transitions.json"
          COUNT="$(jq '.transitions | length' "$TRANSITIONS_FILE")"
          FAILED=0

          for ((i = 0; i < COUNT; i += 1)); do
            article_id="$(jq -r ".transitions[$i].article_id" "$TRANSITIONS_FILE")"
            source_commit="$(jq -r ".transitions[$i].source_commit" "$TRANSITIONS_FILE")"

            # Defense in depth: only a canonical immutable SHA is validated/sent.
            if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::${article_id}: source_commit '${source_commit}' is not a canonical 40-char lowercase hex SHA; refusing."
              FAILED=1
              continue
            fi

            echo "Validating ${article_id} @ ${source_commit} ..."
            if node scripts/validate-content.mjs --ref "$source_commit" --article-id "$article_id"; then
              echo "::notice::${article_id} @ ${source_commit} passed Content Contract validation."
            else
              echo "::error::${article_id} @ ${source_commit} FAILED Content Contract validation; it will NOT be sent to the Publisher."
              FAILED=1
            fi
          done

          if [[ "$FAILED" -gt 0 ]]; then
            echo "::error::One or more authorized commits failed validation; aborting before any Publisher call."
            exit 1
          fi

      - name: Publish ready articles
        if: steps.detect.outputs.count != '0'
        run: |
          set -euo pipefail

          TRANSITIONS_FILE="$RUNNER_TEMP/transitions.json"
          COUNT="$(jq '.transitions | length' "$TRANSITIONS_FILE")"
          FAILED=0

          for ((i = 0; i < COUNT; i += 1)); do
            dir="$(jq -r ".transitions[$i].dir" "$TRANSITIONS_FILE")"
            article_id="$(jq -r ".transitions[$i].article_id" "$TRANSITIONS_FILE")"
            source_commit="$(jq -r ".transitions[$i].source_commit" "$TRANSITIONS_FILE")"

            # The human authorized this specific immutable content version; never
            # degrade it to GITHUB_SHA / HEAD / main / a short SHA.
            if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::${article_id}: source_commit '${source_commit}' is not a canonical 40-char lowercase hex SHA; refusing to publish."
              FAILED=1
              continue
            fi

            body="$(jq -nc \
              --arg repository "LyraWang6688/WeChat-Draft-Capability" \
              --arg article_id "$article_id" \
              --arg ref "main" \
              --arg source_commit "$source_commit" \
              '{repository:$repository, article_id:$article_id, ref:$ref, source_commit:$source_commit}')"

            echo "::notice::Publishing ${dir} (article_id=${article_id}, source_commit=${source_commit})"
            echo "Publisher request body: ${body}"

            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              echo "::notice::dry_run=true: request logged, Publisher API not called for ${article_id}."
              continue
            fi

            if [[ -z "${PUBLISHER_ENDPOINT:-}" || -z "${PUBLISHER_WEBHOOK_TOKEN:-}" ]]; then
              echo "::error::${article_id}: PUBLISHER_ENDPOINT or PUBLISHER_WEBHOOK_TOKEN is not configured in repo secrets."
              FAILED=1
              continue
            fi

            url="${PUBLISHER_ENDPOINT%/}/api/publisher/drafts"
            response="$(curl -sS --max-time 60 \
              -w $'\n%{http_code}' \
              -X POST "$url" \
              -H "Authorization: Bearer ${PUBLISHER_WEBHOOK_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "$body")" || true

            http_code="$(printf '%s\n' "$response" | tail -n1)"
            response_body="$(printf '%s\n' "$response" | sed '$d')"

            ok_flag="$(printf '%s' "$response_body" | jq -r '.ok // false' 2>/dev/null || echo false)"
            error_code="$(printf '%s' "$response_body" | jq -r '.error.code // empty' 2>/dev/null || true)"

            if [[ "$http_code" =~ ^[0-9]{3}$ ]] && [[ "$http_code" -ge 200 && "$http_code" -lt 300 ]] && [[ "$ok_flag" == "true" ]]; then
              echo "::notice::${article_id}: Publisher accepted (HTTP ${http_code})."
            else
              echo "::error::${article_id}: Publisher request failed (HTTP ${http_code:-no-response}, publisher_error_code=${error_code:-unknown})."
              FAILED=1
            fi
          done

          if [[ "$FAILED" -gt 0 ]]; then
            echo "::error::One or more Publisher requests failed; marking workflow as failed. Manual re-run: GitHub Actions -> Re-run jobs."
            exit 1
          fi
