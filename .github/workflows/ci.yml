name: CI

# Pre-E2E Safety Gate — READ-ONLY verification only.
#
# This workflow is strictly separate from publish-ready-articles.yml.
# It MUST NOT:
#   - call the Publisher production endpoint
#   - call WeChat
#   - use WECHAT_APP_SECRET / PUBLISHER_WEBHOOK_TOKEN
#   - produce any external write side effect
# It only installs dependencies and runs local, deterministic checks.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests, content validator, committed diff-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Validate content (Content Contract gate)
        run: node scripts/validate-content.mjs

      - name: Whitespace check (committed diff)
        run: |
          set -euo pipefail

          ZERO_SHA="0000000000000000000000000000000000000000"
          # Well-known empty tree object, computed at runtime to avoid hardcoding.
          EMPTY_TREE="$(git hash-object -t tree /dev/null)"

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              # Committed diff introduced by the pull request: base...head.
              RANGE_BASE="${{ github.event.pull_request.base.sha }}"
              RANGE_HEAD="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              # Committed diff introduced by this push: before...after.
              RANGE_BASE="${{ github.event.before }}"
              RANGE_HEAD="${{ github.event.after }}"
              if [[ -z "${RANGE_BASE}" || "${RANGE_BASE}" == "${ZERO_SHA}" ]]; then
                # Branch creation / no usable parent: check every file as added.
                RANGE_BASE="${EMPTY_TREE}"
              fi
              ;;
            *)
              echo "::error::No committed diff-check rule for event '${GITHUB_EVENT_NAME}'."
              exit 1
              ;;
          esac

          echo "Checking committed whitespace diff: ${RANGE_BASE}...${RANGE_HEAD}"
          git diff --check "${RANGE_BASE}...${RANGE_HEAD}"
